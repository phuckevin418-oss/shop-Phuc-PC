<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHÚC PC GAMING</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f5f7fa;
}

/* TOP BAR */

.topbar{
background:#d70018;
color:white;
text-align:center;
padding:10px;
font-weight:bold;
}

/* HEADER */

header{
background:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:32px;
font-weight:bold;
color:#d70018;
}

.search{
flex:1;
margin:10px 25px;
}

.search input{
width:100%;
padding:12px;
border:2px solid #ddd;
border-radius:10px;
font-size:16px;
}

.cart{
background:#d70018;
color:white;
padding:10px 20px;
border-radius:10px;
font-weight:bold;
}

/* MENU */

.menu{
background:#111827;
}

.menu ul{
display:flex;
list-style:none;
flex-wrap:wrap;
}

.menu li{
position:relative;
padding:15px 20px;
color:white;
cursor:pointer;
}

.menu li:hover{
background:#d70018;
}

/* MEGA MENU */

.mega-menu{
display:none;
position:absolute;
left:0;
top:100%;
width:800px;
background:white;
padding:20px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
z-index:1000;
}

.dropdown:hover .mega-menu{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.mega-menu h4{
color:#d70018;
margin-bottom:10px;
}

.mega-menu a{
display:block;
padding:5px 0;
text-decoration:none;
color:#333;
}

.mega-menu a:hover{
color:#d70018;
}

/* SLIDER */

.slider{
position:relative;
height:450px;
overflow:hidden;
}

.slide{
position:absolute;
width:100%;
height:100%;
opacity:0;
transition:1s;
}

.slide.active{
opacity:1;
}

.slide img{
width:100%;
height:100%;
object-fit:cover;
}

.slider-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,.5);
color:white;
border:none;
font-size:30px;
padding:10px;
cursor:pointer;
z-index:2;
}

.prev{
left:10px;
}

.next{
right:10px;
}

/* FLASH SALE */

.flash-sale{
background:#d70018;
color:white;
margin:20px;
padding:25px;
border-radius:15px;
text-align:center;
}

.timer{
font-size:35px;
font-weight:bold;
margin-top:10px;

<html lang="vi">

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:linear-gradient(90deg,#0f172a,#1d4ed8);
padding:20px;
text-align:center;
color:white;
position:sticky;
top:0;
z-index:999;
}

header h1{
font-size:40px;
}

.search{
margin-top:15px;
}

.search input{
width:90%;
max-width:500px;
padding:12px;
border:none;
border-radius:30px;
font-size:16px;
}

.banner{
margin:20px;
padding:40px;
border-radius:20px;
background:linear-gradient(135deg,#2563eb,#60a5fa);
color:white;
text-align:center;
}

.banner h2{
font-size:40px;
}

.menu{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin:20px;
}

.menu button{
background:#111827;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
}

.menu button:hover{
background:#2563eb;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 20px rgba(0,0,0,.1);
transition:.3s;
position:relative;
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.tag{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:5px 10px;
font-size:12px;
border-radius:5px;
}

.content{
padding:15px;
text-align:center;
}

.price{
font-size:26px;
font-weight:bold;
color:red;
margin:10px 0;
}

.buy{
background:#2563eb;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
}

.buy:hover{
background:#1d4ed8;
}

.cart{
background:white;
margin:20px;
padding:20px;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

footer{
background:#111827;
color:white;
text-align:center;
padding:30px;
margin-top:30px;
}

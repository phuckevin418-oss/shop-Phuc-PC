  .mega-menu{

}

.dropdown:hover .mega-menu{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.mega-menu h4{
color:#d70018;
margin-bottom:10px;
}

.mega-menu a{
display:block;
padding:5px 0;
text-decoration:none;
color:#333;
}

.brand-slider{
overflow:hidden;
background:white;
padding:20px;
margin:20px;
border-radius:12px;
}

.brand-track{
display:flex;
gap:50px;
animation:brandMove 20s linear infinite;
}

.brand-item{
font-size:30px;
font-weight:bold;
color:#666;
white-space:nowrap;
}

@keyframes brandMove{
from{
transform:translateX(100%);
}
to{
transform:translateX(-100%);
}
}

.flash-sale{
background:#d70018;
color:white;
margin:20px;
padding:20px;
border-radius:15px;
text-align:center;
}

.timer{

}

.rating{
color:#f59e0b;

.toast{
position:fixed;
top:20px;
right:20px;
background:#16a34a;
color:white;
padding:15px 20px;
border-radius:10px;
display:none;
z-index:99999;
}

.brand-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
padding:20px;
}

.brand-card{

padding:20px;
border-radius:10px;
text-align:center;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,.1);

transition:.3s;
}

.brand-card:hover{
transform:translateY(-5px);

color:white;
}

.views{

}
